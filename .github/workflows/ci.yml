name: CI

on:
  pull_request:
    branches: [dev, main, prod]
  push:
    branches: [dev, main, prod]

concurrency:
  group: ci-${{ github.ref }}
  # Ne jamais interrompre un déploiement en cours sur main ou prod
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets:
    name: Scan de secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # L'action lit la liste des commits de la PR via l'API
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lislestart/api db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    # Signale les vulnérabilités sans faire échouer la CI : sinon deploy.yml (qui attend une CI
    # réussie) serait bloqué par une faille d'une dépendance transitive sans correctif disponible.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level high

  # Le déploiement vit dans ce workflow (et non dans un workflow_run) pour s'exécuter sur la
  # branche poussée : les environnements GitHub n'acceptent que main (staging) et prod (production).
  deploy:
    name: Déployer l'API et le web
    needs: [secrets, quality]
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'prod')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'production' || 'staging' }}
    steps:
      - name: Déclencher les hooks Render
        env:
          HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -z "$HOOK_API" ] || [ -z "$HOOK_WEB" ]; then
            echo "::warning::Hooks de déploiement non configurés pour cet environnement (voir docs/operations.md)."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK_API"
          curl --fail --silent --show-error -X POST "$HOOK_WEB"
