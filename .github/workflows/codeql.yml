name: CodeQL

# Le code scanning de GitHub n'est pas disponible sur ce dépôt privé (GitHub Code Security payant) :
# l'analyse tourne sans envoi, le rapport SARIF est publié en artefact et le job échoue
# s'il trouve une alerte de niveau « error ».
on:
  pull_request:
    branches: [dev, main, prod]
  push:
    branches: [dev, main, prod]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyse SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: sarif
          retention-days: 30
      - name: Bloquer sur les alertes de niveau error
        run: |
          node -e '
            const fs = require("fs");
            const results = fs.readdirSync("sarif")
              .flatMap((f) => JSON.parse(fs.readFileSync(`sarif/${f}`, "utf8")).runs)
              .flatMap((run) => run.results ?? []);
            for (const r of results) {
              const loc = r.locations?.[0]?.physicalLocation;
              console.log(`${r.level ?? "warning"} ${r.ruleId} ${loc?.artifactLocation?.uri}:${loc?.region?.startLine} — ${r.message.text}`);
            }
            const errors = results.filter((r) => r.level === "error").length;
            console.log(`${results.length} alerte(s), dont ${errors} de niveau error.`);
            process.exit(errors > 0 ? 1 : 0);
          '
